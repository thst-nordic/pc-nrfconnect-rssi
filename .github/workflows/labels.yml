name: check_labels

on:
    pull_request:
        types:
            - opened
            - labeled
            - unlabeled
            - synchronize

jobs:
    # Forks lack Nordic PR labels; mirror required check name check_labels / check_label.
    check_label:
        if: github.repository_owner != 'nordicsemi'
        runs-on: ubuntu-latest
        steps:
            - name: Skip Nordic label rules outside nordicsemi org
              run: echo "Label enforcement runs on nordicsemi org only."

    check_labels:
        if: github.repository_owner == 'nordicsemi'
        uses: nordicsemi/pc-nrfconnect-shared/.github/workflows/labels.yml@main
        secrets: inherit
